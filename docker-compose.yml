services:
  flowbridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowbridge
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "7070:8080"
    environment:
      FLOWBRIDGE_CONFIG: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
      - flowbridge-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  flowbridge-data:
    name: flowbridge-data
